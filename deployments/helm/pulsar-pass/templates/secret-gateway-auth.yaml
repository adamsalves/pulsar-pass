{{/* Bearer-token table for the gateway (cycle 8, issue #45): the
identity mapping lives in a Secret — values carry dev-oriented
defaults only, exactly like the postgres password. */}}
{{- if .Values.services.gateway.authTokens }}
---
apiVersion: v1
kind: Secret
metadata:
  name: pulsar-gateway-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsar-pass.componentLabels" (dict "root" $ "name" "gateway") | nindent 4 }}
type: Opaque
stringData:
  AUTH_TOKENS: {{ .Values.services.gateway.authTokens | quote }}
{{- end }}
