# NATS with JetStream — single-node faithful to compose (-js -sd /data),
# with the stream storage on a PVC. Clients reach nats:4222; the
# monitoring port serves /healthz and /varz probes. The nats-server Go
# module is pinned at 2.12 (dependencyabot preserves the pin), so the
# image follows the same major.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: pulsarpass
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.12-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitoring
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          volumeMounts:
            - name: jsdata
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: jsdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: pulsarpass
spec:
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: client
