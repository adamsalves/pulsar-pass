# Redis fast-path accelerator (hold:{reservation_id}), same command
# line as compose. The holds store degrades gracefully and PostgreSQL
# stays the authority, so a single in-cluster replica is enough for the
# dev cluster; the --notify-keyspace-events flag mirrors compose parity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pulsarpass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--notify-keyspace-events", "Ex"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pulsarpass
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis
