# Grafana datasource provisioned through the sidecar label — the chart
# picks up any ConfigMap labeled grafana_datasource=1. The chart is
# installed with release name "prometheus" in the monitoring namespace,
# so the in-cluster URL is prometheus-server.monitoring.svc:80.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-prometheus
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc:80
        isDefault: true
---
# Prometheus UI on NodePort 30090 (kind maps host :9090 to it). The
# selector matches the prometheus chart's server workload with the
# release name pinned by make deploy-infra.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-ui
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/component: server
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
# Grafana UI on NodePort 30300 (kind maps host :3000 to it).
apiVersion: v1
kind: Service
metadata:
  name: grafana-ui
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30300
